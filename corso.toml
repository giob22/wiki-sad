# corso.toml — dati del corso e configurazione del sito di studio.
#
# Lo leggono gli script in output/ (crea_sito.py, crea_pdf.py, riferimenti_nei_titoli.py).
# Le lezioni del sito si ricavano da sole da wiki/corso-completo.md (ogni "## Lezione N — titolo");
# qui sotto si aggiungono solo i dati in più (descrizione breve, approfondimenti, esclusioni).

[corso]
nome = "Software Architecture Design"           # es. "Trasmissione dei Segnali Digitali"
sigla = "sad"               # es. "tsd": nome della repo (wiki-tsd) e prefisso delle preferenze del sito
descrizione = "LM Ingegneria Informatica, UNINA, DIETI, a.a. 2026/27, 6 CFU, prof.ssa Anna Rita Fasolino; esame: progetto di gruppo Agile e prova orale"   # es. "LM Ingegneria Informatica, UNINA, docente ..., esame orale"

[sito]
# Testo introduttivo dell'indice (Markdown, formule ammesse).
intro = "Teoria del corso, lezione per lezione. Ogni pagina riporta solo ciò che c'è nelle slide, nell'ordine delle slide; sotto, a comparsa, le spiegazioni e gli esempi espansi."
# Etichetta del primo elemento delle «briciole» (es. "Intercorso", "Esame", "Corso").
briciola = "Corso"
# Lezioni da pubblicare: "tutte", oppure un elenco di numeri (es. [3, 4, 5, 7] per un sito d'intercorso).
lezioni = "tutte"
# Righe in più nella legenda «Come si legge» dell'indice (Markdown), es. lezioni escluse e perché.
note = ["La presentazione del corso e il progetto PICUS non sono teoria e non compaiono qui."]

# Nome corto di ogni PDF, usato nei titoli quando una sezione cita più file (riferimenti_nei_titoli.py).
# [pdf_corti]
# "Campionamento_AD_DA.pdf" = "Campionamento"

# ---------------------------------------------------------------------------------------------------------
# Una voce [[lezioni]] per ogni lezione che ha dati in più. Tutti i campi tranne n sono facoltativi.
#
# [[lezioni]]
# n = 3                                   # numero della lezione in corso-completo.md
# breve = "Una riga che riassume la lezione (compare nella scheda dell'indice e sotto il titolo)."
# titolo = ""                             # per sovrascrivere il titolo preso da corso-completo.md
# inizio = ""                             # pubblica la lezione a partire da questo titolo (es. "### Limiti della quantizzazione uniforme")
# sito = true                             # false = la lezione non compare sul sito
# --- approfondimenti: SOLO se l'utente lo decide (di default il sito contiene solo il contenuto dei PDF) ---
# concetti = ["quantizzazione-non-uniforme", "companding"]   # pagine wiki/concetti/: spiegazione e dimostrazioni a comparsa
# esercizi = []                                              # pagine wiki/esercizi/ (a comparsa)
# fonte = "campionamento-conversione-ad-da"                  # pagina wiki/fonti/ da cui prendere le «Domande da esame»
# domande = false                                            # true = mostra le domande da esame della fonte
# domande_filtro = []                                        # tieni solo le domande che contengono una di queste parole
#
# Disegni SVG (output/sito_disegni.py, funzioni fig_<chiave>): vanno in fondo alla sezione indicata.
# Anche questi SOLO su decisione dell'utente.
# [[figure]]
# lezione = 3
# sezione = "Quantizzazione ottima: Lloyd-Max"   # inizio del titolo della sezione (senza i riferimenti ai PDF)
# disegni = ["esempio"]

# =========================================================================================================
# Lezioni del corso Software Architecture Design

[[lezioni]]
n = 1
breve = "Cos'è un'architettura software (Bass, Clements, Kazman): strutture di modulo, componenti e connettori e di allocazione, con l'Exam Booking System come esempio guida; attributi di qualità, scenari, tattiche e pattern; le undici ragioni per cui l'architettura è importante."
concetti = ["architettura-software", "strutture-e-viste", "strutture-di-modulo", "strutture-componenti-e-connettori", "strutture-di-allocazione", "attributi-di-qualita", "scenari-di-qualita", "valutazione-attributi-di-qualita", "tattiche-architetturali", "importanza-architettura-software", "buone-pratiche-architetturali", "entità/exam-booking-system", "entità/uml", "entità/attribute-driven-design"]

[[lezioni]]
n = 2
breve = "La disponibilità: fault, error e failure, MTBF e MTTR, SLA e tabella dei «nove»; scenari; tattiche per rilevare, recuperare e prevenire i guasti; pattern di ridondanza e circuit breaker; dallo scenario alle decisioni (RTO e RPO) e alle tecnologie."
concetti = ["availability", "tattiche-availability", "entità/circuit-breaker"]

[[lezioni]]
n = 3
breve = "La modificabilità: le quattro domande per pianificarla, il costo del cambiamento e il debito tecnico; scalabilità, variabilità, portabilità e indipendenza dalla posizione; tattiche (coesione, accoppiamento, binding) e pattern client-server, plug-in, layers, publish-subscribe."
concetti = ["modifiability", "tattiche-modifiability", "pattern-modifiability", "entità/client-server", "entità/plug-in", "entità/layered", "entità/publish-subscribe", "linee-di-prodotto-software"]

[[lezioni]]
n = 4
breve = "Progettare riusando l'esperienza: strategie e metodi, DSSA e architetture di riferimento, linee di prodotto software, pattern architetturali; State-Logic-Display e architetture 1, 2 e 3 tier con i loro attributi di qualità, middleware, pattern di deployment a 4 tier e load-balanced cluster."
concetti = ["progettazione-basata-sul-riuso", "dssa", "linee-di-prodotto-software", "pattern-architetturali", "architetture-multi-tier", "entità/state-logic-display"]

[[lezioni]]
n = 5
breve = "Il Model-View-Controller e le sue varianti (classico con pull e observer, web lato server, UI reattiva) con Observer e Strategy; Front Controller, Spring MVC e Spring Boot con un esempio completo; il pattern Sense-Compute-Control a tre e quattro stadi, IoT, Lunar Lander e guida autonoma."
concetti = ["entità/mvc", "entità/spring-mvc", "entità/sense-compute-control"]

[[lezioni]]
n = 6
breve = "Agile Project Management (parte 1): Manifesto e principi, iterazioni e sviluppo evolutivo, ruoli e cerimonie, artefatti, user story e INVEST, criteri di accettazione e BDD, Definition of Done, demo di iterazione e information radiator (scrum board, kanban, burndown)."
concetti = ["sviluppo-agile", "cerimonie-e-artefatti-agile", "user-stories", "criteri-di-accettazione-e-bdd"]

[[lezioni]]
n = 7
breve = "Agile Project Management (parte 2), il framework Scrum: empirismo e tre pilastri, ruoli, Sprint e ciclo di vita, Product Backlog e refinement, Sprint Planning, Story Point con Planning Poker, velocity e capacity, Daily Scrum, Sprint Review e Retrospective."
concetti = ["gestione-progetto-plan-driven-vs-agile", "scrum", "ciclo-di-vita-scrum", "product-backlog-e-sprint-backlog", "sprint-e-sprint-planning", "stima-story-points-velocity-capacity", "entità/planning-poker", "daily-scrum-review-retrospective"]

[[lezioni]]
n = 9
breve = "Il processo di progettazione architetturale: requisiti architetturalmente significativi (ASR), Quality Attribute Workshop e utility tree; il metodo Attribute-Driven Design in sette passi, dalla revisione degli ingressi alla scelta dei design concept, alle interfacce, agli schizzi e alla rationale, fino all'analisi."
concetti = ["entità/attribute-driven-design", "scenari-di-qualita"]

[[lezioni]]
n = 10
breve = "Servizi e architetture orientate ai servizi (SOA) in confronto ai microservizi: contratti, comunicazione sincrona e asincrona, API HTTP, REST, SOAP/WSDL e OpenAPI, evoluzione dei contratti, intermediari (broker, discovery, API gateway, ESB), orchestrazione e coreografia; esempio FTGO."
concetti = ["entità/microservices", "entità/publish-subscribe"]
